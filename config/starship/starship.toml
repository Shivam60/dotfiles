"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:#7aa2f7)\
[$os$username](bg:#7aa2f7 fg:#1a1b26)\
[](fg:#7aa2f7 bg:#565f89)\
$directory\
[](fg:#565f89 bg:#414868)\
$git_branch$git_status\
[](fg:#414868)\
$fill\
$dotnet$python$nodejs$cmd_duration$time\
$line_break$character"""

# Keep the prompt snappy: never let a module stall the shell.
command_timeout = 1000
scan_timeout = 50
add_newline = false

[fill]
symbol = ' '

[os]
disabled = false
style = "bg:#7aa2f7 fg:#1a1b26"
format = '[ $symbol]($style)'

[os.symbols]
Windows = ""

[username]
show_always = false
style_user = "bg:#7aa2f7 fg:#1a1b26"
format = '[ $user ]($style)'

[directory]
style = "bg:#565f89 fg:#c0caf5"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = ""
read_only = "  "

[git_branch]
symbol = ""
style = "bg:#414868 fg:#9ece6a"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#414868 fg:#e0af68"
format = '[$all_status$ahead_behind ]($style)'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "="
untracked = "?${count}"
stashed = '\$${count}'
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[dotnet]
symbol = " "
style = "fg:#7dcfff"
format = '[ $symbol($version) ]($style)'
# Version detection walks the directory tree; skip it for speed.
heuristic = true

[python]
symbol = " "
style = "fg:#e0af68"
format = '[ $symbol($version)(\($virtualenv\)) ]($style)'

[nodejs]
symbol = " "
style = "fg:#9ece6a"
format = '[ $symbol($version) ]($style)'

[cmd_duration]
min_time = 500
style = "fg:#bb9af7"
format = '[  $duration ]($style)'

[time]
disabled = false
time_format = "%H:%M:%S"
style = "fg:#565f89"
format = '[ $time ]($style)'

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #7aa2f7)"

# Modules that shell out but that you don't use — off for speed.
[package]
disabled = true
[rust]
disabled = true
[golang]
disabled = true
[java]
disabled = true
[ruby]
disabled = true
[php]
disabled = true
[docker_context]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
[azure]
disabled = true
